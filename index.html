<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="COLE_O_LINK_DA_SUA_IMAGEM_AQUI.png">
  <title>Dashboard XAU M15</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap');
    
    :root {
      --bg-color: #0b0e14; 
      --card-bg: #151a23;  
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #eab308; 
      --accent-hover: #ca8a04;
      --border: rgba(45, 212, 191, 0.15);
      --profit: #4ade80; 
      --loss: #f87171;   
    }

    * { box-sizing: border-box; }

    /* Trava absoluta para o tamanho da tela */
    html, body {
      margin: 0; padding: 0;
      width: 100%; max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
    }

    .app-wrapper {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; overflow-x: hidden;
    }

    header {
      width: 100%; padding: 2rem 0; text-align: center; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-color) 100%);
    }

    header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--text-muted); margin-top: 0.5rem; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }

    /* Alinhamento perfeito entre as sessões superiores e inferiores */
    .summary-container, .container {
      width: 92%; max-width: 1200px; margin: 2rem auto;
    }

    .summary-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 0;
    }

    .container {
      display: grid; grid-template-columns: 360px 1fr; gap: 2rem; align-items: stretch;
    }

    .summary-card {
      background-color: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      min-width: 0; /* Trava de vazamento */
    }
    .summary-card h3 { margin: 0 0 0.5rem 0; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
    .summary-card p { margin: 0; font-size: 2rem; font-weight: 800; color: var(--text-main); }
    
    .profit-text { color: var(--profit) !important; }

    .card { 
      background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; 
      padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      display: flex; flex-direction: column; width: 100%;
      min-width: 0; /* TRAVA MÁGICA: Impede o card de expandir além da tela */
    }

    .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-main); border-left: 4px solid var(--accent); padding-left: 0.75rem; margin-bottom: 1.5rem; }

    form#formulario { display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-width: 0; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem; min-width: 0; }
    .form-group { min-width: 0; } /* Trava o vazamento de inputs */
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    
    .form-group input, .form-group select { 
      width: 100%; max-width: 100%; padding: 0.9rem; background-color: var(--bg-color); border: 1px solid var(--border); 
      border-radius: 8px; color: var(--text-main); font-family: 'JetBrains Mono', monospace;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }

    button.btn-primario { 
      width: 100%; padding: 1rem; background-color: var(--accent); color: #000; border: none; 
      border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; 
      text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; margin-top: 0.5rem;
    }
    button.btn-primario:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

    /* TABELA RESPONSIVA (SCROLL HORIZONTAL) */
    .table-wrapper {
      max-height: 310px; 
      overflow-y: auto; overflow-x: auto; 
      -webkit-overflow-scrolling: touch; 
      border-radius: 0 0 8px 8px;
      width: 100%; min-width: 0; /* Trava de vazamento da tabela */
    }
    
    .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrapper::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .table-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
    
    th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; position: sticky; top: 0; background-color: var(--card-bg); z-index: 10; }
    tr:hover { background-color: rgba(255,255,255,0.02); }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.80rem; font-weight: 700; text-transform: uppercase; }
    .badge-compra { background: rgba(74, 222, 128, 0.15); color: var(--profit); }
    .badge-venda { background: rgba(248, 113, 113, 0.15); color: var(--loss); }
    .badge-op { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

    .btn-excluir { background-color: var(--loss); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: pointer; opacity: 1; font-family: 'JetBrains Mono', monospace; }
    
    /* REGRAS ESPECÍFICAS PARA CELULAR */
    @media (max-width: 768px) {
      .summary-container, .container { width: 92%; }
      .container { grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; }
      .summary-container { grid-template-columns: 1fr 1fr; gap: 1rem; }
      
      .summary-card { padding: 1.2rem 1rem; }
      .summary-card p { font-size: 1.3rem; }
      
      .form-row { grid-template-columns: 1fr; margin-bottom: 0; gap: 0; }
      .form-group { margin-bottom: 1rem; }
      
      .card { padding: 1.2rem; }
      .table-wrapper { max-height: 400px; }
    }

    @media (min-width: 769px) {
      .btn-excluir { opacity: 0; transition: all 0.2s; }
      tr:hover .btn-excluir { opacity: 1; }
      .btn-excluir:hover { background-color: #ef4444; transform: scale(1.05); }
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <header>
    <h1>XAUUSD<span> M15</span></h1>
    <p>Diário de Operações • Dashboard</p>
  </header>

  <div class="summary-container">
    <div class="summary-card">
      <h3>Capital Inicial</h3>
      <p id="valCapitalInicial">Carregando...</p>
    </div>
    <div class="summary-card">
      <h3>Capital Atual</h3>
      <p id="valCapitalAtual">Carregando...</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Nova Entrada</h2>
      <form id="formulario">
        <div>
          <div class="form-row">
            <div class="form-group"><label>Data</label><input type="date" id="inputData" required></div>
            <div class="form-group"><label>Operação</label><select id="inputOperacao" required><option value="Compra">Compra</option><option value="Venda">Venda</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Lote</label><input type="number" id="inputLote" step="0.01" value="2" required></div>
            <div class="form-group"><label>Pontos (PTS)</label><input type="number" id="inputPts" step="0.01" placeholder="Ex: 58.2" required></div>
          </div>
        </div>
        <button type="submit" id="btnSalvar" class="btn-primario">Registrar Operação</button>
      </form>
    </div>

    <div class="card"> 
      <h2>Histórico (Últimos Registros)</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>OP</th><th>Data</th><th>Operação</th><th>Lote</th><th>PTS</th><th>Resultado (R$)</th><th style="width: 80px;"></th></tr>
          </thead>
          <tbody id="tabelaDados">
            <tr><td colspan="7" style="text-align:center; padding: 2rem;">Sincronizando com a planilha...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHEWMSl2jkLA1EGk79GbuDgBUgFWcM8ukVuphxy0S-wCqS3thCwN43184uerca8Z5i/exec';
    document.getElementById('inputData').valueAsDate = new Date();

    async function carregarDashboard() {
      try {
        const resposta = await fetch(API_URL);
        const json = await resposta.json();
        
        const capitalInicial = parseFloat(json.capitalInicial) || 0;
        const capitalAtual = parseFloat(json.capitalAtual) || 0;

        document.getElementById('valCapitalInicial').innerText = `$ ${capitalInicial.toFixed(2)}`;
        
        const elCapitalAtual = document.getElementById('valCapitalAtual');
        elCapitalAtual.innerText = `$ ${capitalAtual.toFixed(2)}`;
        
        if (capitalAtual > capitalInicial) elCapitalAtual.classList.add('profit-text');
        else elCapitalAtual.classList.remove('profit-text');

        const corpoTabela = document.getElementById('tabelaDados');
        corpoTabela.innerHTML = ''; 

        json.registros.reverse().forEach(linha => {
          const op = linha.OP || '-';
          const operacao = linha.OPERAÇÃO || '---';
          const lote = linha.LOTE || 0;
          const ptsNum = parseFloat(linha.PTS || 0);
          
          let resultadoNum = parseFloat(linha.RESULTADO);
          if (isNaN(resultadoNum)) resultadoNum = 0; 

          const corPts = ptsNum >= 0 ? 'var(--profit)' : 'var(--loss)';
          const corResultado = resultadoNum >= 0 ? 'var(--profit)' : 'var(--loss)';
          const badgeOpClass = operacao.toUpperCase() === 'COMPRA' ? 'badge-compra' : 'badge-venda';
          
          let dataBr = '-';
          if (linha.DATA) {
             const dataObj = new Date(linha.DATA);
             dataBr = dataObj.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="badge badge-op">#${op}</span></td>
            <td style="color: var(--text-muted);">${dataBr}</td>
            <td><span class="badge ${badgeOpClass}">${operacao}</span></td>
            <td>${lote}</td>
            <td style="color: ${corPts}; font-weight: 600;">${ptsNum > 0 ? '+' : ''}${ptsNum.toFixed(1)}</td>
            <td style="color: ${corResultado}; font-weight: 800;">$ ${resultadoNum.toFixed(2)}</td>
            <td style="text-align: right;"><button class="btn-excluir" onclick="excluirOp(${op}, this)">Excluir</button></td>
          `;
          corpoTabela.appendChild(tr);
        });
      } catch (erro) {
        document.getElementById('tabelaDados').innerHTML = '<tr><td colspan="7" style="text-align:center;">Erro ao carregar dados.</td></tr>';
      }
    }

    async function excluirOp(op, botaoElemento) {
      if (!confirm(`Tem certeza que deseja excluir a OP #${op} da planilha?`)) return;
      const textoOriginal = botaoElemento.innerText;
      botaoElemento.innerText = 'Excluindo...';
      botaoElemento.style.opacity = '1';
      botaoElemento.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', op: op }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        setTimeout(async () => { await carregarDashboard(); }, 800);
      } catch (erro) {
        alert('Erro de comunicação. Não foi possível excluir.');
        botaoElemento.innerText = textoOriginal;
        botaoElemento.disabled = false;
      }
    }

    document.getElementById('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const botao = document.getElementById('btnSalvar');
      botao.innerText = 'ENVIANDO...';
      
      const dadosForm = {
        action: 'insert', 
        data: document.getElementById('inputData').value,
        operacao: document.getElementById('inputOperacao').value,
        lote: document.getElementById('inputLote').value,
        pts: document.getElementById('inputPts').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dadosForm),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        setTimeout(async () => {
          await carregarDashboard(); 
          botao.innerText = 'Registrar Operação';
          document.getElementById('inputPts').value = ''; 
        }, 1000);
      } catch (erro) {
        alert('Houve um erro ao enviar.');
        botao.innerText = 'Registrar Operação';
      }
    });

    carregarDashboard();
  </script>
</body>
</html>
